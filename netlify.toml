[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/api/*"
  to = "https://backend-licenta-i0lr.onrender.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Permissions-Policy = "geolocation=(), microphone=(self), camera=()"
    Content-Security-Policy = "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; media-src 'self' blob: data: https:; connect-src 'self' https://backend-licenta-i0lr.onrender.com wss://backend-licenta-i0lr.onrender.com ws: wss: https://accounts.google.com https://*.googleapis.com https://*.google.com https://*.stripe.com https://*.elfsight.com https://*.elfsightcdn.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://translate.google.com https://translate.googleapis.com https://*.gstatic.com https://*.stripe.com https://elfsightcdn.com https://*.elfsightcdn.com https://*.elfsight.com; frame-src 'self' https://accounts.google.com https://*.google.com https://*.stripe.com https://*.elfsight.com;"