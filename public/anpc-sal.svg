    <text x="0" y="3.5" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="800" letter-spacing="0.4">SAL</text>
  </g>
  <!-- Text block -->
  <text x="64" y="19" fill="#ffd200" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="800" letter-spacing="1.1">ANPC · PROTECȚIA CONSUMATORILOR</text>
  <text x="64" y="34" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="700">SOLUȚIONAREA ALTERNATIVĂ</text>
  <text x="64" y="46" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="700">A LITIGIILOR</text>
  <text x="64" y="56" fill="#cfe2ff" font-family="Arial, Helvetica, sans-serif" font-size="7.5" font-weight="600">anpc.ro/ce-este-sal/</text>
