      <stop offset="0%" stop-color="#0b3470"/>
      <stop offset="100%" stop-color="#0052a5"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="258" height="60" rx="10" fill="url(#salBg)" stroke="#ffd200" stroke-width="1.6"/>
  <!-- Tricolor Romania ribbon -->
  <rect x="1" y="1" width="6" height="20" rx="2" fill="#002b7f"/>
  <rect x="1" y="21" width="6" height="20" fill="#fcd116"/>
  <rect x="1" y="41" width="6" height="20" rx="2" fill="#ce1126"/>
  <!-- Left emblem circle with EU stars & scales -->
  <g transform="translate(36, 31)">
