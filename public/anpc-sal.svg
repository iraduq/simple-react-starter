      <circle cx="7.2" cy="-12.5" r="1.2"/>
      <circle cx="12.5" cy="-7.2" r="1.2"/>
      <circle cx="14.5" cy="0" r="1.2"/>
      <circle cx="12.5" cy="7.2" r="1.2"/>
      <circle cx="7.2" cy="12.5" r="1.2"/>
      <circle cx="0" cy="14.5" r="1.2"/>
      <circle cx="-7.2" cy="12.5" r="1.2"/>
      <circle cx="-12.5" cy="7.2" r="1.2"/>
      <circle cx="-14.5" cy="0" r="1.2"/>
      <circle cx="-12.5" cy="-7.2" r="1.2"/>
